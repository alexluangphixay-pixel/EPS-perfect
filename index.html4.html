<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ซ้อมสอบ EPS">
<meta name="theme-color" content="#1E4DA1">
<title>ซ้อมสอบทักษะ EPS</title>
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#172033; --muted:#566176; --line:#D3DAE5;
  --blue:#1E4DA1; --on-blue:#FFFFFF; --blue-soft:#DCE6F7;
  --red:#B8352D; --red-soft:#F8E0DD; --green:#1B7552; --green-soft:#D7EEE3;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F141D; --surface:#182131; --ink:#E8EDF5; --muted:#9FABBD; --line:#2C3749;
    --blue:#86AAF2; --on-blue:#0E1626; --blue-soft:#1E2D4B;
    --red:#F29088; --red-soft:#3A2220; --green:#6FCFA2; --green-soft:#183629;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Thonburi","Noto Sans Thai",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;
}
#app{max-width:520px;margin:0 auto;padding:16px 16px 48px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* home */
.home-title{font-size:26px;font-weight:700;line-height:1.35;margin:12px 0 2px}
.home-sub{color:var(--muted);margin:0 0 16px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--blue-soft);margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.deck{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.emblem{flex:none;width:56px;height:56px;border-radius:14px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-size:28px;font-weight:700}
.deck-main{flex:1;min-width:0}
.deck-name{font-weight:700}
.deck-meta{color:var(--muted);font-size:14px}
.track{height:6px;border-radius:3px;background:var(--blue-soft);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue)}
.note{background:var(--red-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.note.calm{background:var(--blue-soft)}
.small{color:var(--muted);font-size:14px}

/* session */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.top-title{flex:1;font-weight:700}
.top-count{color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--blue-soft);border-radius:2px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--blue)}
.task{color:var(--muted);font-size:14px;margin:0 0 8px}
.q{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:16px;padding:18px;font-size:28px;line-height:1.5;font-weight:600;word-break:keep-all}
.q.quiet{font-size:18px;font-weight:500;color:var(--muted)}
.bigcard{margin-top:10px;background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:12px;text-align:center;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.tools-row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.thbox{background:var(--blue-soft);border-radius:12px;padding:10px 14px;margin:6px 0}
.mic-wrap{display:flex;flex-direction:column;align-items:center;margin:18px 0 10px}
.mic{position:relative;width:88px;height:88px;border-radius:50%;border:0;background:var(--blue);color:var(--on-blue);display:grid;place-items:center}
.mic.on{background:var(--red);color:#fff}
.mic.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--red);animation:ring 1.2s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.6}to{transform:scale(1.25);opacity:0}}
@media (prefers-reduced-motion: reduce){.mic.on::after{animation:none;opacity:.5}}
.mic-label{margin-top:10px;color:var(--muted);font-size:14px}
.live{min-height:3.2em;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:18px}
.alt-row{display:flex;gap:8px;margin:12px 0 4px}
.input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;padding:0 4px}
.btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 16px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.good{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.btn.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn.block{width:100%}
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0 0}
.result .said{font-size:20px;margin:2px 0 8px}
.pill{display:inline-block;border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700}
.pill.good{background:var(--green-soft);color:var(--green)}
.pill.mid{background:var(--blue-soft);color:var(--blue)}
.pill.low{background:var(--red-soft);color:var(--red)}
.model{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.model .ko{font-size:21px;font-weight:600;line-height:1.55}
.model .th{color:var(--muted);margin:6px 0}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* summary, setup, vocab */
h2{font-size:22px;line-height:1.35;margin:8px 0 4px}
h3{font-size:16px;margin:20px 0 6px}
.stat{display:flex;gap:10px;margin:12px 0}
.stat div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.logrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.logrow .dot{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.logrow .dot.good{background:var(--green-soft);color:var(--green)}
.logrow .dot.bad{background:var(--red-soft);color:var(--red)}
.field{display:block;margin:12px 0}
.field span{display:block;font-weight:600;margin-bottom:4px}
.field small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:2px}
.field .input{width:100%;flex:none}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px;min-height:56px}
.vrow .k{font-size:20px;font-weight:600}
.vrow .t{color:var(--muted);font-size:15px;text-align:right}
[hidden]{display:none!important}
.ic{display:block}
.ic .f{fill:var(--ink)}
.ic .fa{fill:var(--blue)}
.ic .bg{fill:var(--surface)}
.ic .s{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ic .sa{fill:none;stroke:var(--blue);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.steps{display:flex;gap:6px;margin:0 0 12px}
.steps span{flex:1;text-align:center;font-size:13px;line-height:1.3;padding:7px 4px;border-radius:10px;background:var(--blue-soft);color:var(--muted);font-weight:600}
.steps span.on{background:var(--blue);color:var(--on-blue)}
.steps span.ok{background:var(--green-soft);color:var(--green)}
.tray{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;min-height:112px}
.tool b{font-size:15px;line-height:1.3;text-align:center;word-break:keep-all}
.tool.wrong{border-color:var(--red);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.tool.wrong{animation:none}}
.scene{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;touch-action:none;-webkit-user-select:none;user-select:none}
.holdbtn{width:100%;min-height:64px;margin-top:10px;border-radius:16px;border:0;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:18px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.holdbtn.on{background:var(--red);color:#fff}
.act-hint{color:var(--muted);margin:8px 0 0;text-align:center}
.seg-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.wd{background:var(--blue-soft);border-radius:10px;padding:6px 10px;text-align:center}
.wd b{display:block;font-size:19px;line-height:1.4}
.wd small{color:var(--muted);font-size:13px}
.ok-title{font-weight:700;color:var(--green);font-size:18px;margin-bottom:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.photo{display:flex;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:10px;padding:8px}
.photo img{max-width:100%;max-height:260px;object-fit:contain}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue);margin-right:6px}
.clock.over{color:var(--red)}
.thumb{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line);flex:none}
.vrow .l{display:flex;align-items:center;gap:10px;min-width:0}
</style>
</head>

/* ---------- Korean numbers ---------- */
const SD=['','일','이','삼','사','오','육','칠','팔','구'];
function sino(n){
  n=Math.floor(n);if(n===0)return'영';
  const th=Math.floor(n/1000),h=Math.floor(n%1000/100),t=Math.floor(n%100/10),o=n%10;
  let s='';
  if(th)s+=(th>1?SD[th]:'')+'천';
  if(h)s+=(h>1?SD[h]:'')+'백';
  if(t)s+=(t>1?SD[t]:'')+'십';
  return s+SD[o];
}
const NO=['','한','두','세','네','다섯','여섯','일곱','여덟','아홉'];
const NT=['','열','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
function native(n){
  if(n<1||n>99)return String(n);
  if(n===20)return'스무';
  return NT[Math.floor(n/10)]+NO[n%10];
}
function hasBatchim(s){const c=s.charCodeAt(s.length-1)-0xAC00;return c>=0&&c<11172&&c%28!==0;}
function josa(w,a,b){return w+(hasBatchim(w)?a:b);}
function monthKo(m){return m===6?'유월':m===10?'시월':sino(m)+'월';}

/* ---------- text similarity (jamo level) ---------- */
function norm(s){return String(s||'').replace(/[\s.,!?~·'"“”‘’()\/\-–—]/g,'').normalize('NFD');}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=new Array(n+1),cur=new Array(n+1);
  for(let j=0;j<=n;j++)prev[j]=j;
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}
    const t=prev;prev=cur;cur=t;
  }
  return prev[n];
}
function sim(a,b){a=norm(a);b=norm(b);const L=Math.max(a.length,b.length);return L?1-lev(a,b)/L:1;}

/* gestures */
function mountRotate(svg,it,fin){
  const g=svg.querySelector('#rot'),ring=svg.querySelector('#ring');
  let total=0,last=null,done=false;
  const ang=e=>{const p=svgPt(svg,e);return Math.atan2(p.y-100,p.x-160);};
  const upd=()=>{
    const pr=Math.min(1,total/540);
    g.setAttribute('transform','rotate('+total.toFixed(1)+' 160 100)');
    ring.setAttribute('stroke-dasharray',(pr*402).toFixed(1)+' 402');
    actMsg(pr<1?'หมุนแล้ว '+Math.round(pr*100)+'%':'');
    if(pr>=1&&!done){done=true;fin();}
  };
  svg.onpointerdown=e=>{if(done)return;cap(svg,e);last=ang(e);};
  svg.onpointermove=e=>{
    if(last==null||done)return;
    const a=ang(e);let d=a-last;
    while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    last=a;total=Math.max(0,total+d*180/Math.PI);upd();
  };
  const up=()=>{last=null;};
  svg.onpointerup=up;svg.onpointercancel=up;
}
function mountTap(svg,it,fin){
  const nail=svg.querySelector('#nail'),ham=svg.querySelector('#ham');
  let n=0,busy=false;
  const pose=(sink,deg)=>{ham.style.transform='translateY('+sink+'px) rotate('+deg+'deg)';};
  pose(0,18);
  svg.onpointerdown=e=>{
    if(busy||n>=5)return;busy=true;
    pose(n*16,-9);
    setTimeout(()=>{
      n++;
      nail.style.transform='translateY('+(n*16)+'px)';
      pose(n*16,18);
      actMsg(n<5?'ตอกแล้ว '+n+'/5':'');
      busy=false;
      if(n>=5)setTimeout(fin,250);
    },90);
  };
}
function mountHold(svg,it,fin){
  const btn=document.getElementById('holdbtn');if(!btn)return;
  const isDrill=it.spec.act==='drill',T=isDrill?2000:800;
  const drl=svg.querySelector('#drl'),hole=svg.querySelector('#hole'),bt=svg.querySelector('#bt'),bb=svg.querySelector('#bb'),wl=svg.querySelector('#wl'),wr=svg.querySelector('#wr');
  let p=0,last=0,raf=0,held=false,done=false;
  const apply=()=>{
    if(isDrill){const tr=p*54;drl.setAttribute('transform','translate(0 '+tr.toFixed(1)+')');hole.setAttribute('height',Math.max(0,tr-14).toFixed(1));}
    else{const tr=p*28;bt.setAttribute('transform','translate(0 '+tr.toFixed(1)+')');bb.setAttribute('transform','translate(0 '+(-tr).toFixed(1)+')');if(p>=1){wl.setAttribute('transform','translate(-8 -3)');wr.setAttribute('transform','translate(8 3)');}}
    actMsg(p<1?Math.round(p*100)+'%':'');
  };
  const step=t=>{
    if(!held)return;
    p=Math.min(1,p+Math.max(0,t-last)/T);last=t;apply();
    if(p>=1){done=true;held=false;btn.classList.remove('on');btn.textContent='เสร็จแล้ว';fin();return;}
    raf=requestAnimationFrame(step);
  };
  btn.onpointerdown=e=>{if(done)return;e.preventDefault();cap(btn,e);held=true;btn.classList.add('on');last=performance.now();raf=requestAnimationFrame(step);};
  const up=()=>{held=false;btn.classList.remove('on');cancelAnimationFrame(raf);};
  btn.onpointerup=up;btn.onpointercancel=up;btn.oncontextmenu=e=>e.preventDefault();
}
function mountCut(svg,it,fin){
  const line=svg.querySelector('#cutdone'),pl=svg.querySelector('#pl'),pr=svg.querySelector('#pr'),scs=svg.querySelector('#scs'),bl=svg.querySelector('#bl');
  let a=null,b=null,drag=false,done=false;
  const mv=e=>{
    const p=svgPt(svg,e);
    const sx=Math.max(60,Math.min(260,p.x)),sy=Math.max(45,Math.min(155,p.y));
    const s=Math.tan((6+(Math.sin(sy/4)+1)*5)*Math.PI/180)*40;
    scs.setAttribute('opacity','1');scs.setAttribute('transform','translate('+sx.toFixed(1)+' '+sy.toFixed(1)+')');
    bl.setAttribute('d','M0 0 L'+(-s).toFixed(1)+' 40 M0 0 L'+s.toFixed(1)+' 40');
    if(Math.abs(p.x-160)>34)return;
    a=a==null?sy:Math.min(a,sy);b=b==null?sy:Math.max(b,sy);
    line.setAttribute('y1',a);line.setAttribute('y2',b);
    const cov=(b-a)/110;
    actMsg(cov<0.85?'ตัดไปแล้ว '+Math.round(cov/0.85*100)+'%':'');
    if(cov>=0.85&&!done){done=true;pl.setAttribute('transform','translate(-14 0) rotate(-3 110 100)');pr.setAttribute('transform','translate(14 0) rotate(3 210 100)');fin();}
  };
  svg.onpointerdown=e=>{if(done)return;drag=true;cap(svg,e);mv(e);};
  svg.onpointermove=e=>{if(drag&&!done)mv(e);};
  const up=()=>{drag=false;};
  svg.onpointerup=up;svg.onpointercancel=up;
}
function mountSaw(svg,it,fin){
  const saw=svg.querySelector('#saw'),kerf=svg.querySelector('#kerf'),wl=svg.querySelector('#wl'),wr=svg.querySelector('#wr');
  const NEED=6;
  let drag=false,done=false,lastX=0,dir=0,acc=0,count=0;
  const upd=x=>{
    const pr=Math.min(1,count/NEED),tx=Math.max(-45,Math.min(45,(x-160)*0.5)),ty=pr*44;
    saw.setAttribute('transform','translate('+tx.toFixed(1)+' '+ty.toFixed(1)+')');
    kerf.setAttribute('height',Math.max(0,ty-12).toFixed(1));
    actMsg(count<NEED?'เลื่อยไปแล้ว '+count+'/'+NEED+' ครั้ง':'');
    if(count>=NEED&&!done){done=true;wl.setAttribute('transform','translate(-8 0)');wr.setAttribute('transform','translate(8 0)');fin();}
  };
  svg.onpointerdown=e=>{if(done)return;drag=true;cap(svg,e);lastX=svgPt(svg,e).x;dir=0;acc=0;};
  svg.onpointermove=e=>{
    if(!drag||done)return;
    const x=svgPt(svg,e).x,dx=x-lastX;lastX=x;
    if(Math.abs(dx)<0.5){upd(x);return;}
    const d=dx>0?1:-1;
    if(dir!==0&&d!==dir){if(Math.abs(acc)>=40)count++;acc=0;}
    dir=d;acc+=dx;upd(x);
  };
  const up=()=>{if(!drag)return;drag=false;if(Math.abs(acc)>=40)count++;acc=0;dir=0;upd(lastX);};
  svg.onpointerup=up;svg.onpointercancel=up;
}
function mountExtend(svg,it,fin){
  const P=it.params,mv=svg.querySelector('#mv'),strip=svg.querySelector('#strip'),rd=svg.querySelector('#reading');
  let x=P.x0,drag=false,done=false;
  const set=nx=>{
    x=Math.max(P.min,Math.min(P.max,nx));
    mv.setAttribute('transform','translate('+(x-P.x0).toFixed(1)+' 0)');
    if(strip)strip.setAttribute('width',Math.max(0,x-52).toFixed(1));
  };
  svg.onpointerdown=e=>{if(done)return;drag=true;cap(svg,e);set(svgPt(svg,e).x);};
  svg.onpointermove=e=>{if(drag&&!done)set(svgPt(svg,e).x);};
  const up=()=>{
    if(!drag||done)return;drag=false;
    if(Math.abs(x-P.target)<=7){done=true;set(P.target);rd.textContent=P.reading;rd.setAttribute('opacity','1');actMsg('');fin();}
    else actMsg(x>P.target?'เลยปลายไปแล้ว ลองใหม่':'ยังไม่ถึงปลาย ลากต่อ');
  };
  svg.onpointerup=up;svg.onpointercancel=up;
}
function mountBend(svg,it,fin){
  const P=it.params,w=svg.querySelector('#wire'),k=svg.querySelector('#knob');
  let y=P.y0,drag=false,done=false;
  const set=ny=>{y=Math.max(30,Math.min(190,ny));w.setAttribute('d',bpath(y));k.setAttribute('transform','translate(160 '+y+')');};
  svg.onpointerdown=e=>{if(done)return;drag=true;cap(svg,e);set(svgPt(svg,e).y);};
  svg.onpointermove=e=>{if(drag&&!done)set(svgPt(svg,e).y);};
  const up=()=>{
    if(!drag||done)return;drag=false;
    const dy=Math.abs(y-120),ok=P.mode==='straighten'?dy<=8:dy>=45;
    if(ok){done=true;if(P.mode==='straighten')set(120);actMsg('');fin();}
    else actMsg(P.mode==='straighten'?'ยังไม่ตรง ลากให้ลวดทับเส้นประ':'ยังงอไม่พอ ลากให้งอมากขึ้น');
  };
  svg.onpointerup=up;svg.onpointercancel=up;
}

 {id:'wire',ko:'철사',th:'ลวดเหล็ก'},{id:'rebar',ko:'철근',th:'เหล็กเส้น'},{id:'nut',ko:'너트',th:'น็อต'},{id:'screw',ko:'나사못',th:'สกรู'},

function matPos(order,id){const i=order.indexOf(id);return{x:54+84*(i%4),y:38+70*Math.floor(i/4)};}

    case 'hexbolt':{let t='';for(let x=-6;x<26;x+=6)t+='M'+x+' -7 l3 14 ';return '<rect x="-30" y="-14" width="16" height="28" rx="2" fill="'+METAL_D+'"/><path d="M-26 -14 V14 M-18 -14 V14" stroke="'+METAL+'" stroke-width="1.5"/><rect x="-14" y="-7" width="44" height="14" fill="'+METAL+'"/><path d="'+t+'" stroke="'+METAL_D+'" stroke-width="1.5" fill="none"/>';}
    case 'nail':return '<rect x="-28" y="-9" width="5" height="18" rx="1" fill="'+METAL_D+'"/><rect x="-23" y="-2" width="50" height="4" fill="'+METAL+'"/><path d="M27 -2 L33 0 L27 2Z" fill="'+METAL+'"/>';
    case 'paper':return '<rect x="-24" y="-26" width="48" height="52" fill="#fff" stroke="#9AA4B5" stroke-width="2"/><path d="M-16 -12H16M-16 0H16M-16 12H16" stroke="#C5CCD8" stroke-width="3"/>';
    case 'weeds':return '<path d="M-18 16 q-4 -22 -10 -34 M-9 16 q-2 -30 -2 -40 M0 16 q2 -26 8 -38 M9 16 q6 -22 16 -30 M18 16 q2 -14 10 -22" fill="none" stroke="#3E8E41" stroke-width="3" stroke-linecap="round"/><rect x="-26" y="14" width="52" height="8" rx="3" fill="#7A5C3A"/>';
    case 'soil':return '<path d="M-30 16 q8 -28 20 -14 q10 -20 22 -2 q10 -12 18 16 Z" fill="#7A5C3A"/><path d="M-24 10 h10 M-4 6 h12 M14 12 h10" stroke="#5A4128" stroke-width="2"/>';
    case 'field':return '<rect x="-32" y="-14" width="64" height="30" rx="4" fill="#8B6B4A"/><path d="M-28 -6 H28 M-28 2 H28 M-28 10 H28" stroke="#6B4F34" stroke-width="3"/>';

function shortName(s){return String(s).split(' / ')[0];}
function benchSvg(ord,labels){
  let h='<rect width="360" height="400" fill="#D9BE96"/><path d="M0 74H360M0 144H360" stroke="#C9AB80" stroke-width="2"/><rect x="6" y="158" width="348" height="236" rx="14" fill="#7A5C3A"/>';
  ord.mats.forEach(id=>{
    const m=BENCH_MAT.find(x=>x.id===id),p=matPos(ord.mats,id);
    h+='<g transform="translate('+p.x+' '+p.y+')"><rect id="hl_'+id+'" x="-40" y="-32" width="80" height="78" rx="10" fill="none" stroke="var(--blue)" stroke-width="3" opacity="0"/>'+matGlyph(id)+(labels?'<text y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#2B2118">'+m.ko+'</text>':'')+'</g>';
  });
  ord.tools.forEach(id=>{
    const p=toolPos(ord.tools,id);
    const pic=TPHOTO[id]&&IMG[TPHOTO[id]];
    const icon=pic?'<rect x="-32" y="-30" width="64" height="60" rx="10" fill="#fff"/><image href="'+IMG[TPHOTO[id]]+'" x="-30" y="-28" width="60" height="56" preserveAspectRatio="xMidYMid meet" style="pointer-events:none"/>':'<rect x="-32" y="-30" width="64" height="60" rx="10" fill="var(--surface)"/><svg class="ic" x="-26" y="-26" width="52" height="52" viewBox="0 0 64 64">'+TICON[id]+'</svg>';
    h+='<g class="tl" data-id="'+id+'" transform="translate('+p.x+' '+p.y+')" style="cursor:grab">'+icon+(labels?'<text y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#F5E9D8">'+esc(shortName(TNAME[id]))+'</text>':'')+'</g>';
  });
  return h;
}
function mountBench(svg,it,ok){
  const sp=it.spec,ord=sess.bench;
  let drag=null;
  const hit=(x,y)=>{for(const id of ord.mats){const p=matPos(ord.mats,id);if(Math.abs(x-p.x)<=40&&y>=p.y-32&&y<=p.y+46)return id;}return null;};
  const hl=id=>{ord.mats.forEach(m=>{const e=svg.querySelector('#hl_'+m);if(e)e.setAttribute('opacity',m===id?'1':'0');});};
  const mv=e=>{
    if(!drag)return;
    const p=svgPt(svg,e),x=Math.max(20,Math.min(340,p.x)),y=Math.max(30,Math.min(380,p.y-30));
    drag.x=x;drag.y=y;
    drag.el.setAttribute('transform','translate('+x.toFixed(1)+' '+y.toFixed(1)+') scale(1.15)');
    hl(hit(x,y));
  };
  svg.onpointerdown=e=>{
    const el=e.target&&e.target.closest?e.target.closest('.tl'):null;
    if(!el||drag)return;
    cap(svg,e);
    el.style.transition='none';
    svg.appendChild(el);
    drag={id:el.dataset.id,el:el,home:toolPos(ord.tools,el.dataset.id),x:0,y:0};
    mv(e);
  };
  svg.onpointermove=mv;
  const up=()=>{
    if(!drag)return;
    const d=drag;drag=null;hl(null);
    const m=hit(d.x,d.y);
    const home=()=>{d.el.style.transition='transform .18s';d.el.setAttribute('transform','translate('+d.home.x+' '+d.home.y+')');};
    if(m==null){home();actMsg('วางเครื่องมือลงบนวัสดุที่ต้องใช้');return;}
    const toolOk=d.id===sp.tool,matOk=sp.mats.indexOf(m)>=0;
    if(toolOk&&matOk){
      const p=matPos(ord.mats,m);
      d.el.style.transition='transform .18s';
      d.el.setAttribute('transform','translate('+p.x+' '+(p.y-6)+') scale(1.2)');
      setTimeout(ok,220);
      return;
    }
    ui.wrong++;if(ui.wrong>=2)ui.hint=true;
    home();
    if(!toolOk)actMsg(ui.wrong>=2?'ใบ้: ต้องใช้ '+sp.toolKo+' ('+sp.toolTh+')':'ไม่ใช่เครื่องมือที่คำสั่งบอก ลองฟังคำสั่งอีกครั้ง');
    else actMsg(ui.wrong>=2?'ใบ้: ต้องใช้กับ '+sp.op[1]:'เครื่องมือถูกแล้ว แต่วัสดุไม่ตรงกับคำสั่ง');
    speak(it.say);
  };
  svg.onpointerup=up;svg.onpointercancel=up;
}

function nameAnswers(ko,alts){

  [ko].concat(alts||[]).forEach(n=>{

    out.push(w+'입니다.');out.push(w+(hasBatchim(w)?'이에요.':'예요.'));out.push(w);
  });
  return out;
}

function mountWeed(svg,it,fin){
  const spr=svg.querySelector('#spr');
  let drag=false,done=false,cut=0,mistakes=0,warned=null;
  const cutSet={};
  const mv=e=>{
    const p=svgPt(svg,e);
    spr.setAttribute('x',(p.x-30).toFixed(1));spr.setAttribute('y',(p.y-8).toFixed(1));
    if(!drag||done)return;
    let changed=false;
    WEED_X.forEach((wx,i)=>{
      if(cutSet[i])return;
      if(Math.abs(p.x-wx)<=18&&p.y>=70&&p.y<=140){
        cutSet[i]=1;cut++;changed=true;
        const g=svg.querySelector('#wd'+i);g.setAttribute('opacity','0');g.setAttribute('transform','translate('+wx+' 140) rotate(40)');
      }
    });
    let near=null;
    CROP_X.forEach(cx=>{if(Math.abs(p.x-cx)<=16&&p.y>=70&&p.y<=140)near=cx;});
    if(near!=null&&warned!==near){mistakes++;warned=near;actMsg('ระวัง! นั่นคือต้นพืช ไม่ใช่วัชพืช');}
    else if(near==null)warned=null;
    if(changed&&near==null)actMsg(cut<WEED_X.length?'ถอนวัชพืชแล้ว '+cut+'/'+WEED_X.length:'');
    if(cut>=WEED_X.length&&!done){done=true;ui.mistakes=mistakes;fin();}
  };
  svg.onpointerdown=e=>{if(done)return;drag=true;cap(svg,e);mv(e);};
  svg.onpointermove=mv;
  const up=()=>{drag=false;};
  svg.onpointerup=up;svg.onpointercancel=up;
}
function mountDig(svg,it,fin){
  const spr=svg.querySelector('#spr'),tr=svg.querySelector('#tr');
  const NEED=5;
  let drag=false,done=false,sy=0,down=0,n=0;
  const mv=e=>{
    const p=svgPt(svg,e);
    spr.setAttribute('transform','translate('+(p.x-112).toFixed(1)+' '+(p.y-34).toFixed(1)+')');
    if(drag)down=Math.max(down,p.y-sy);
  };
  svg.onpointerdown=e=>{if(done)return;drag=true;cap(svg,e);sy=svgPt(svg,e).y;down=0;mv(e);};
  svg.onpointermove=mv;
  const up=()=>{
    if(!drag||done)return;drag=false;
    if(down>=36){
      n++;tr.setAttribute('width',Math.min(200,n*40));
      actMsg(n<NEED?'ขุดแล้ว '+n+'/'+NEED+' ครั้ง':'');
      if(n>=NEED){done=true;fin();}
    }else actMsg('ลากนิ้วลงมาให้แรงขึ้น เหมือนฟันจอบลงดิน');
  };
  svg.onpointerup=up;svg.onpointercancel=up;
}
function mountTill(svg,it,fin){
  const spr=svg.querySelector('#spr'),tl=svg.querySelector('#tl');
  let prog=20,drag=false,done=false;
  const mv=e=>{
    const x=Math.max(20,Math.min(300,svgPt(svg,e).x));
    spr.setAttribute('x',(x-50).toFixed(1));
    if(!drag||done)return;
    prog=Math.max(prog,Math.min(x,prog+40));
    tl.setAttribute('width',(prog-20).toFixed(1));
    actMsg(prog<290?'ไถแล้ว '+Math.round((prog-20)/270*100)+'%':'');
    if(prog>=290){done=true;fin();}
  };
  svg.onpointerdown=e=>{if(done)return;drag=true;cap(svg,e);mv(e);};
  svg.onpointermove=mv;
  const up=()=>{drag=false;};
  svg.onpointerup=up;svg.onpointercancel=up;
}

function buildNew(ref){
  const n=ref.n;
  if(ref.deck==='wtool'){
    if(n<=WT.length){
      const t=WT[n-1];
      const a=nameAnswers(t.ko,t.alts);
      return quizItem('w'+n,'wtool',n,'이 도구의 이름은 무엇입니까?','ชื่อเครื่องมือนี้คืออะไร',a,t.th+' ('+t.en+') · สาขา '+secTh(t.sec),t.k);
    }
    const f=FT[n-WT.length-1];
    return quizItem('w'+n,'wtool',n,f.q,f.th,nameAnswers(f.a),f.ath+' · สาขา '+secTh(f.sec),null);
  }
  if(ref.deck==='picto'){
    const p=PT[n-1];
    return quizItem('p'+n,'picto',n,'이 기호의 의미는 무엇입니까?','ป้ายนี้มีความหมายว่าอย่างไร',p.ans,p.th+' ('+p.en+') · '+p.grp,p.k);
  }

/* ---------- hand-dexterity practice: colour pegs and jigsaw ---------- */
const PEG_COLORS=[
 {id:'red',hex:'#E53935',ko:'빨간색',th:'แดง'},{id:'blue',hex:'#1E88E5',ko:'파란색',th:'น้ำเงิน'},{id:'yellow',hex:'#FDD835',ko:'노란색',th:'เหลือง'},
 {id:'green',hex:'#43A047',ko:'초록색',th:'เขียว'},{id:'orange',hex:'#FB8C00',ko:'주황색',th:'ส้ม'}
];
let gs=null,gIv=null;
function gTime(){return gs&&gs.t0?Math.floor((Date.now()-gs.t0)/1000):0;}
function stopG(){if(gIv){clearInterval(gIv);gIv=null;}}
function startG(){
  stopG();
  gIv=setInterval(()=>{
    if(!gs||gs.done)return;
    const el=document.getElementById('gtime');if(el)el.textContent=gClockText();
    if(gs.opt.lim&&gTime()>=gs.opt.lim)gTimeUp();
  },250);
}
function activeCols(){return gs.opt.cols===2?PEG_COLORS.filter(c=>c.id==='red'||c.id==='green'):PEG_COLORS;}
function gClockText(){const t=gTime();return gs.opt&&gs.opt.lim?'เหลือ '+fmtT(Math.max(0,gs.opt.lim-t)):fmtT(t);}
function gTimeUp(){
  stopG();gs.done=true;gs.timeup=true;
  gs.total=Object.keys(gs.pat).length;
  gs.okCount=Object.keys(gs.pat).filter(c=>gs.board[c]===gs.pat[c]).length;
  const p=document.getElementById('gdone');
  if(p){p.innerHTML=gDonePanel();p.hidden=false;setTimeout(()=>{try{p.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},150);}
}

function bestKey(){return gs.kind+'-'+(gs.kind==='peg'?gs.opt.mode+'-c'+gs.opt.cols+'-l'+gs.opt.lim+'-':'')+gs.opt.n;}
function gDonePanel(){
  if(gs.timeup)return '<div class="model"><div class="ok-title" style="color:var(--red)">หมดเวลา</div><div class="stat"><div><b>'+gs.okCount+'/'+gs.total+'</b>ปักถูก</div><div><b>'+gs.mist+'</b>ผิดพลาด</div></div></div><div class="rate"><button class="btn" data-a="home">กลับหน้าแรก</button><button class="btn primary" data-a="gagain">ลองอีกครั้ง</button></div>';
  return '<div class="model"><div class="ok-title">✓ เสร็จแล้ว</div><div class="stat"><div><b>'+fmtT(gs.finalT)+'</b>เวลา</div>'+(gs.kind==='peg'?'<div><b>'+gs.mist+'</b>ผิดพลาด</div>':'')+'<div><b>'+fmtT(gs.bestT)+'</b>ดีที่สุด</div></div>'+(gs.newBest?'<span class="pill good">สถิติใหม่!</span>':'')+'</div><div class="rate"><button class="btn" data-a="home">กลับหน้าแรก</button><button class="btn primary" data-a="gagain">เล่นอีกครั้ง</button></div>';
}
function gDone(){
  stopG();gs.done=true;
  const t=gTime(),best=store.get('eps_best',{}),k=bestKey(),prev=best[k];
  gs.newBest=prev==null||t<prev;
  if(gs.newBest){best[k]=t;store.set('eps_best',best);}
  gs.finalT=t;gs.bestT=prev==null?t:Math.min(prev,t);
  const p=document.getElementById('gdone');
  if(p){p.innerHTML=gDonePanel();p.hidden=false;setTimeout(()=>{try{p.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},150);}
}

/* colour pegs */
function pegGeo(){
  const n=gs.opt.n,copy=gs.opt.mode==='copy',sp=Math.min(52,Math.floor(250/n)),bs2=sp*n,left=180-bs2/2,top=copy?150:90,k=activeCols().length;
  return{n:n,sp:sp,left:left,top:top,r:sp*0.32,cx:i=>left+sp*((i%n)+0.5),cy:i=>top+sp*(Math.floor(i/n)+0.5),trayY:480,trayX:i=>180+(i-(k-1)/2)*70};
}
function pegColor(id){return PEG_COLORS.find(c=>c.id===id);}
function pegHoleAt(g,x,y){for(let i=0;i<g.n*g.n;i++){if(Math.hypot(x-g.cx(i),y-g.cy(i))<=g.sp*0.5)return i;}return null;}
function pegTrayAt(g,x,y){const cs=activeCols();for(let i=0;i<cs.length;i++){if(Math.hypot(x-g.trayX(i),y-g.trayY)<=28)return cs[i].id;}return null;}

function pegSetup(){
  const n=gs.opt.n,k=Math.max(3,Math.round(n*n*0.6));
  const cells=shuffle(range(0,n*n-1)).slice(0,k),pat={};
  const cs=activeCols();cells.forEach(c=>{pat[c]=cs[rand(cs.length)].id;});
  gs.pat=pat;gs.board={};gs.seq=gs.opt.mode==='cmd'?shuffle(cells.slice()):null;gs.step=0;
}
function pegStatic(){
  const g=pegGeo();
  let h='<rect width="360" height="560" fill="#E6D3B3"/>';
  if(gs.opt.mode==='copy'){
    const sp2=Math.min(22,Math.floor(110/g.n)),l2=180-sp2*g.n/2,t2=26;
    h+='<text x="180" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#5A4128">แบบที่ต้องทำตาม</text><rect x="'+(l2-6)+'" y="'+(t2-6)+'" width="'+(sp2*g.n+12)+'" height="'+(sp2*g.n+12)+'" rx="8" fill="#fff" stroke="#9A7B52" stroke-width="2"/>';
    for(let i=0;i<g.n*g.n;i++){const x=l2+sp2*((i%g.n)+0.5),y=t2+sp2*(Math.floor(i/g.n)+0.5),c=gs.pat[i];h+='<circle cx="'+x+'" cy="'+y+'" r="'+(sp2*0.34)+'" fill="'+(c?pegColor(c).hex:'#E6D3B3')+'" stroke="#5A4128" stroke-width="1"/>';}
  }
  h+='<rect x="'+(g.left-10)+'" y="'+(g.top-10)+'" width="'+(g.sp*g.n+20)+'" height="'+(g.sp*g.n+20)+'" rx="12" fill="#B98A5B" stroke="#6B4A2A" stroke-width="3"/>';
  for(let i=0;i<g.n*g.n;i++)h+='<circle cx="'+g.cx(i)+'" cy="'+g.cy(i)+'" r="'+(g.r*0.7)+'" fill="#6B4A2A"/>';
  h+='<rect x="8" y="'+(g.trayY-40)+'" width="344" height="92" rx="14" fill="#7A5C3A"/>';
  activeCols().forEach((c,i)=>{h+='<circle cx="'+g.trayX(i)+'" cy="'+g.trayY+'" r="'+(g.r+4)+'" fill="'+c.hex+'" stroke="#2B2118" stroke-width="2"/><text x="'+g.trayX(i)+'" y="'+(g.trayY+38)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#F5E9D8">'+c.ko+'</text>';});
  return h+'<g id="pdyn"></g>';
}
function pegDyn(drag){
  const g=pegGeo();let h='';
  if(gs.opt.mode==='cmd'&&!gs.done&&gs.seq[gs.step]!=null){const c=gs.seq[gs.step];h+='<circle cx="'+g.cx(c)+'" cy="'+g.cy(c)+'" r="'+(g.sp*0.46)+'" fill="none" stroke="#E53935" stroke-width="4"/>';}
  Object.keys(gs.board).forEach(k=>{const i=+k;h+='<circle cx="'+g.cx(i)+'" cy="'+g.cy(i)+'" r="'+g.r+'" fill="'+pegColor(gs.board[k]).hex+'" stroke="#2B2118" stroke-width="2"/>';});
  if(drag)h+='<circle cx="'+drag.x.toFixed(1)+'" cy="'+drag.y.toFixed(1)+'" r="'+(g.r+6)+'" fill="'+pegColor(drag.color).hex+'" stroke="#2B2118" stroke-width="2.5" opacity=".95"/>';
  return h;
}
function pegCmdText(){
  const t=document.getElementById('gcmd');
  if(t&&gs.opt.mode==='cmd'&&gs.seq[gs.step]!=null)t.textContent=pegColor(gs.pat[gs.seq[gs.step]]).ko+' 막대를 꽂으세요.';
}
function sayPeg(){
  if(gs.opt.mode!=='cmd'||gs.seq[gs.step]==null)return;
  pegCmdText();
  speak(pegColor(gs.pat[gs.seq[gs.step]]).ko+' 막대를 꽂으세요.');
}
function mountPeg(svg){
  svg.innerHTML=pegStatic();
  const dyn=svg.querySelector('#pdyn'),g=pegGeo();
  let drag=null;
  const draw=()=>{dyn.innerHTML=pegDyn(drag);};
  const msg=t=>{const m=document.getElementById('gmsg');if(m)m.textContent=t;};
  const complete=()=>{const k=Object.keys(gs.pat);return k.every(c=>gs.board[c]===gs.pat[c])&&Object.keys(gs.board).length===k.length;};
  draw();pegCmdText();
  if(gs.opt.mode==='cmd'&&!gs.said&&!gs.done){gs.said=true;sayPeg();}
  svg.onpointerdown=e=>{
    if(gs.done||drag)return;
    cap(svg,e);
    const p=svgPt(svg,e);let color=null;
    const cell=pegHoleAt(g,p.x,p.y);
    if(cell!=null&&gs.board[cell]&&gs.opt.mode==='copy'){color=gs.board[cell];delete gs.board[cell];}
    else color=pegTrayAt(g,p.x,p.y);
    if(!color)return;
    if(!gs.t0){gs.t0=Date.now();startG();}
    drag={color:color,x:p.x,y:p.y-28};draw();
  };
  svg.onpointermove=e=>{if(!drag)return;const p=svgPt(svg,e);drag.x=p.x;drag.y=p.y-28;draw();};
  const up=()=>{
    if(!drag)return;
    const d=drag;drag=null;
    if(gs.done){draw();return;}
    const cell=pegHoleAt(g,d.x,d.y);
    if(cell!=null&&!gs.board[cell]){
      if(gs.opt.mode==='copy'){
        gs.board[cell]=d.color;if(gs.pat[cell]!==d.color)gs.mist++;
        msg('');draw();if(complete())gDone();return;
      }
      const need=gs.seq[gs.step];
      if(cell===need&&d.color===gs.pat[need]){
        gs.board[cell]=d.color;gs.step++;msg('');
        if(gs.step>=gs.seq.length){draw();gDone();return;}
        draw();sayPeg();return;
      }
      gs.mist++;msg(cell!==need?'ผิดรู ดูวงแดงบนกระดาน':'ผิดสี ฟังคำสั่งอีกครั้ง');sayPeg();
    }
    draw();
  };
  svg.onpointerup=up;svg.onpointercancel=up;
}

/* jigsaw */
function pzScene(){
  let crops='';
  for(let r=0;r<4;r++)for(let c=0;c<9;c++){const x=18+c*33+(r%2)*10,y=206+r*24;crops+='<path d="M'+x+' '+y+' v-12 M'+x+' '+(y-6)+' q-7 -3 -9 -9 M'+x+' '+(y-8)+' q7 -3 9 -9" stroke="#3E8E41" stroke-width="2.5" fill="none" stroke-linecap="round"/>';}
  return '<rect width="300" height="300" fill="#9AD3F5"/><ellipse cx="70" cy="38" rx="32" ry="12" fill="#fff"/><ellipse cx="96" cy="46" rx="24" ry="10" fill="#fff"/><circle cx="246" cy="48" r="26" fill="#FFD54F"/><path d="M0 150 Q70 108 140 140 T300 128 V300 H0Z" fill="#7CB342"/><rect y="190" width="300" height="110" fill="#8B6B4A"/><path d="M0 218H300M0 242H300M0 266H300" stroke="#6B4F34" stroke-width="2"/>'+crops+'<rect x="18" y="104" width="54" height="44" fill="#C62828"/><polygon points="12,106 45,80 78,106" fill="#8E1B1B"/><rect x="36" y="124" width="18" height="24" fill="#FFEBEE"/><path d="M0 176H300M0 186H300" stroke="#fff" stroke-width="3" opacity=".0"/><image href="'+(IMG.sp_cultivator||'')+'" x="96" y="120" width="116" height="104"/>';
}
function pzGeo(){const n=gs.opt.n;return{n:n,size:300/n,bx:30,by:10};}
function pzSetup(){
  const g=pzGeo(),n=g.n,gap=n===3?115:85,rowGap=n===3?100:76;
  const slots=shuffle(range(0,n*n-1));gs.pieces=[];
  for(let i=0;i<n*n;i++){
    const s=slots[i],jx=rand(9)-4,jy=rand(9)-4;
    gs.pieces.push({i:i,col:i%n,row:Math.floor(i/n),x:Math.max(0,10+(s%n)*gap+jx),y:330+Math.floor(s/n)*rowGap+Math.max(0,jy),locked:false});
  }
  gs.order=shuffle(range(0,n*n-1));
}
function pzStatic(){
  const g=pzGeo();
  let h='<rect width="360" height="640" fill="#E6D3B3"/><defs><g id="pzscene">'+pzScene()+'</g>';
  for(let i=0;i<g.n*g.n;i++)h+='<clipPath id="pzc'+i+'"><rect width="'+g.size+'" height="'+g.size+'"/></clipPath>';
  h+='</defs><rect x="'+(g.bx-4)+'" y="'+(g.by-4)+'" width="308" height="308" rx="6" fill="#fff" stroke="#6B4A2A" stroke-width="3"/>';
  for(let k=1;k<g.n;k++)h+='<path d="M'+(g.bx+k*g.size)+' '+g.by+'V'+(g.by+300)+'M'+g.bx+' '+(g.by+k*g.size)+'H'+(g.bx+300)+'" stroke="#C9AB80" stroke-width="1.5" stroke-dasharray="4 4"/>';
  h+='<use id="pzhint" href="#pzscene" x="'+g.bx+'" y="'+g.by+'" opacity=".3" visibility="'+(gs.hint?'visible':'hidden')+'"/><g id="pzdyn"></g>';
  return h;
}
function pzDyn(){
  const g=pzGeo();let h='';
  const piece=p=>'<g transform="translate('+p.x.toFixed(1)+' '+p.y.toFixed(1)+')"><g clip-path="url(#pzc'+p.i+')"><use href="#pzscene" x="'+(-p.col*g.size)+'" y="'+(-p.row*g.size)+'"/></g><rect width="'+g.size+'" height="'+g.size+'" fill="none" stroke="#fff" stroke-width="2"/></g>';
  gs.pieces.filter(p=>p.locked).forEach(p=>{h+=piece(p);});
  gs.order.forEach(i=>{const p=gs.pieces[i];if(!p.locked)h+=piece(p);});
  return h;
}
function mountPuzzle(svg){
  svg.innerHTML=pzStatic();
  const dyn=svg.querySelector('#pzdyn'),g=pzGeo();
  let drag=null;
  const draw=()=>{dyn.innerHTML=pzDyn();};
  draw();
  svg.onpointerdown=e=>{
    if(gs.done||drag)return;
    cap(svg,e);
    const p=svgPt(svg,e);
    for(let k=gs.order.length-1;k>=0;k--){
      const pc=gs.pieces[gs.order[k]];
      if(!pc.locked&&p.x>=pc.x&&p.x<=pc.x+g.size&&p.y>=pc.y&&p.y<=pc.y+g.size){
        if(!gs.t0){gs.t0=Date.now();startG();}
        gs.order.splice(k,1);gs.order.push(pc.i);
        drag={pc:pc,dx:p.x-pc.x,dy:p.y-pc.y};draw();return;
      }
    }
  };
  svg.onpointermove=e=>{
    if(!drag)return;
    const p=svgPt(svg,e);
    drag.pc.x=Math.max(0,Math.min(360-g.size,p.x-drag.dx));
    drag.pc.y=Math.max(0,Math.min(640-g.size,p.y-drag.dy));
    draw();
  };
  const up=()=>{
    if(!drag)return;
    const pc=drag.pc;drag=null;
    const tx=g.bx+pc.col*g.size,ty=g.by+pc.row*g.size;
    if(Math.hypot(pc.x-tx,pc.y-ty)<=g.size*0.35){pc.x=tx;pc.y=ty;pc.locked=true;}
    draw();
    if(gs.pieces.every(q=>q.locked))gDone();
  };
  svg.onpointerup=up;svg.onpointercancel=up;
}

/* burpee counter */
let bs=null,bIv=null;
function stopB(){if(bIv){clearInterval(bIv);bIv=null;}}
function bTick(){
  if(!bs)return;
  const now=Date.now();
  if(bs.stage==='ready'){
    const left=Math.ceil((bs.readyEnd-now)/1000);
    if(left<=0){bs.stage='run';bs.t0=now;bs.count=0;render();return;}
    const el=document.getElementById('bbig');if(el)el.textContent=left;
  }else if(bs.stage==='run'){
    const left=Math.max(0,bs.dur-Math.floor((now-bs.t0)/1000));
    const el=document.getElementById('btime');if(el)el.textContent=fmtT(left);
    if(now-bs.t0>=bs.dur*1000){
      bs.stage='end';stopB();
      const best=store.get('eps_burp',{}),k=String(bs.dur);
      bs.newBest=best[k]==null||bs.count>best[k];
      if(bs.newBest){best[k]=bs.count;store.set('eps_burp',best);}
      bs.best=Math.max(best[k]||0,bs.count);
      render();
    }
  }
}
function renderBurpee(){
  const top='<div class="top"><button class="icon-btn" data-a="home" aria-label="กลับหน้าแรก">'+I.back+'</button><div class="top-title">นับเบอร์ปี</div>'+(bs.stage==='run'?'<div class="clock" id="btime">'+fmtT(bs.dur)+'</div>':'')+'</div>';
  if(bs.stage==='menu'){
    const best=store.get('eps_burp',{});
    const chip=v=>'<button class="chip" data-a="bopt" data-v="'+v+'" aria-pressed="'+(bs.dur===v)+'">'+v+' วินาที</button>';
    return top+'<p class="small">ตัวนับสำหรับฝึก วางมือถือไว้ข้างหน้า แตะ 1 ครั้งเมื่อทำเบอร์ปีครบ 1 ครั้ง</p><div class="note calm">เวลาและเกณฑ์คะแนนจริงผมยังไม่ทราบ เพราะอยู่ในไฟล์ประเมินที่เปิดอ่านไม่ได้ ตามโพสต์ผู้สอบที่คุณส่งมา เริ่มได้คะแนนที่ 10 ครั้งขึ้นไป และ 13 ครั้งถือว่าดี (ยังไม่ยืนยัน) จึงควรฝึกให้เกินนั้นเผื่อไว้ ค่อยๆ เพิ่ม และหยุดถ้าเจ็บ</div><h3>ระยะเวลา</h3><div class="links">'+chip(30)+chip(60)+chip(90)+'</div>'+(best[String(bs.dur)]!=null?'<p class="small">สถิติของ '+bs.dur+' วินาที: '+best[String(bs.dur)]+' ครั้ง</p>':'')+'<button class="btn primary block" data-a="bstart" style="margin-top:12px">เริ่ม (เตรียมตัว 5 วินาที)</button>';
  }
  if(bs.stage==='ready')return top+'<div class="q" style="text-align:center;font-size:20px">เตรียมตัว</div><div class="bigcard" id="bbig" style="font-size:96px;padding:40px">5</div>';
  if(bs.stage==='run')return top+'<div class="bigcard" id="bcount" style="font-size:88px">'+bs.count+'</div><button class="holdbtn" data-a="btap" style="min-height:260px;font-size:26px;margin-top:14px">แตะ = 1 ครั้ง</button>';
  return top+'<div class="model"><div class="ok-title">'+(bs.newBest?'สถิติใหม่!':'หมดเวลา')+'</div><div class="stat"><div><b>'+bs.count+'</b>ครั้ง</div><div><b>'+bs.best+'</b>สถิติ '+bs.dur+' วิ</div></div></div><div class="rate"><button class="btn" data-a="home">กลับหน้าแรก</button><button class="btn primary" data-a="bagain">ทำอีกครั้ง</button></div>';
}
function bStart(){stopB();bs.stage='ready';bs.readyEnd=Date.now()+5000;bs.count=0;render();bIv=setInterval(bTick,200);}

function gameRow(k,glyph,name,meta){
  const best=store.get('eps_best',{});
  return '<button class="deck" data-a="game" data-k="'+k+'"><div class="emblem" aria-hidden="true">'+glyph+'</div><div class="deck-main"><div class="deck-name">'+name+'</div><div class="deck-meta">'+meta+'</div></div></button>';
}

/* ---------- speech out ---------- */
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    voiceKo=vs.find(x=>/^ko/i.test(String(x.lang).replace('_','-')))||null;
  }catch(e){}
}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
function cancelSpeak(){try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}
function speak(text){
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR';if(voiceKo)u.voice=voiceKo;
    u.rate=SET.slow?0.78:1;
    speechSynthesis.speak(u);
  }catch(e){}
}

function intro(words){
  const a=num('age'),f=num('family'),m=num('months');
  const age=a==null?'○○ 살':(words?native(a)+' 살':a+'살');
  const fam=f==null?'○○ 명':(words?native(f)+' 명':f+'명');
  const mon=m==null?'○○개월':(words?sino(m):m)+'개월';
  return '안녕하십니까? 제 이름은 '+(v('name')||'○○')+'입니다. 제 나이는 '+age+'입니다. 저는 '+(v('country')||'○○')+' 사람입니다. 한국어를 배운 지 '+mon+' 됐습니다. '+(v('hometown')||'○○')+'에서 왔습니다. 제 가족은 '+fam+'이 있습니다.'+(v('exp')?' '+v('exp').replace(/[.。]?\s*$/,'.'):'')+' 저는 건강하고 책임감이 높고 모든 것이 빨리 배울 수 있는 사람입니다. 한국에 일하러 갈 기회가 있으면 열심히 일을 할 겁니다. 앞으로 잘 부탁드립니다. 만나서 반갑습니다. 감사합니다.';
}

function build(ref){
  const nb=buildNew(ref);if(nb)return nb;
  if(ref.deck==='motion'){
    const d=MOTION[ref.n-1];
    return{id:'m'+ref.n,deck:'motion',n:ref.n,ko:d[0],say:d[1],th:d[2],answers:ACK,ansKo:'네, 알겠습니다.',ansTh:'ครับ เข้าใจแล้ว — แล้วทำท่า: '+d[2],big:null,long:false};
  }
  if(ref.deck==='tools'){
    const d=TOOLS[ref.n-1],sp=TSPEC[ref.n-1];
    let say=d[1],th=d[2],params={};
    if(sp.act==='bend'){
      const bend=Math.random()<0.5,mode=bend?'bend':'straighten';
      say='플라이어를 가져와서 철사를 '+(bend?'구부리는':'펴는')+' 행동하세요.';
      th=bend?'เอาคีมมา แล้วทำท่างอลวดเหล็ก':'เอาคีมมา แล้วทำท่ายืดลวดเหล็กให้ตรง';
      params={mode:mode,y0:bend?120:120+(Math.random()<0.5?-1:1)*(48+rand(14))};
    }else if(sp.act==='extend'&&sp.kind==='caliper'){
      const mm=25+rand(30),L=mm*3;
      params={x0:290,min:76,max:290,len:L,target:76+L,reading:'ความยาว ≈ '+mm+' มม.'};
    }else if(sp.act==='extend'){
      const cm=12+rand(14),L=cm*8;
      params={x0:60,min:60,max:300,len:L,target:60+L,reading:'ความยาว ≈ '+cm+' ซม.'};
    }
    return{id:'t'+ref.n,deck:'tools',n:ref.n,ko:d[0],say:say,th:th,answers:ACK,ansKo:'네, 알겠습니다.',ansTh:'ครับ เข้าใจแล้ว — แล้วทำท่า: '+th,big:null,long:false,spec:sp,params:params};
  }
  return interview(ref.n);
}

function startSession(kind){
  let list=[],title='',exam=false;
  const M=n=>({deck:'motion',n:n}),T=n=>({deck:'tools',n:n}),Q=n=>({deck:'interview',n:n});
  if(kind==='motion'){list=range(1,21).map(M);title='คำสั่งขยับตัว';}
  else if(kind==='tools'){list=range(1,11).map(T);title='เครื่องมือ';}
  else if(kind==='interview'){list=range(0,41).map(Q);title='สัมภาษณ์';}
  else if(kind==='mix'){
    exam=true;title='ซ้อมสอบผสม';
    const rest=shuffle(shuffle(range(1,21)).slice(0,3).map(M).concat(shuffle(range(1,11)).slice(0,2).map(T),shuffle(range(1,41)).slice(0,8).map(Q)));
    list=[Q(0)].concat(rest);
  }
  else if(kind==='wtool'){list=range(1,WT.length+FT.length).map(n=>({deck:'wtool',n:n}));title='ชื่อเครื่องมือ';}
  else if(kind==='picto'){list=range(1,PT.length).map(n=>({deck:'picto',n:n}));title='ป้ายสัญลักษณ์ความปลอดภัย';}
  else if(kind==='safety'){list=range(1,SF.length).map(n=>({deck:'safety',n:n}));title='อุปกรณ์ความปลอดภัย';}
  else if(kind==='agri'){list=range(1,ASPEC.length).map(n=>({deck:'agri',n:n}));title='ลงมือทำ: เกษตร';}
  else if(kind==='exam'){
    exam=true;title='ซ้อมสอบเต็มรูปแบบ';
    const pick=(a,k)=>shuffle(a.slice()).slice(0,k);
    const basic=pick([2,10,11,12,14,15,16],2).map(Q);
    const acts=pick([1,2,3,4,5,6,13,14],2).map(M);
    const tool=[{deck:'wtool',n:1+rand(3)},{deck:'agri',n:1+rand(ASPEC.length)}];
    const ncs=[Q(18)].concat(pick([25,30,35,39,40],1).map(Q));
    const safety=[{deck:'picto',n:1+rand(PT.length)},{deck:'safety',n:rand(2)?1+rand(2):1+rand(SF.length)}];
    list=[Q(0)].concat(basic,acts,tool,ncs,safety);
  }
  else if(kind==='review'){
    list=Object.keys(wrong).map(refFromId);title='ข้อที่ต้องซ้อมอีก';
  }
  if(!list.length)return;
  if(SET.shuffle&&!exam)shuffle(list);
  sess={kind:kind,title:title,list:list,i:0,exam:exam,started:Date.now(),log:[],cur:null,benches:{}};
  if(kind==='exam')startClock();else stopClock();
  present();
}
function present(){
  stopMic(true);
  sess.cur=build(sess.list[sess.i]);
  if(sess.cur.deck==='tools'){const bk=sess.cur.benchKey||'ind';sess.bench=sess.benches[bk]||(sess.benches[bk]=makeBench(bk));}
  ui={phase:'ask',showTh:false,peek:false,msg:'',res:null,stage:'ack',wrong:0,hint:false,ackText:'',ackOk:null};
  view='session';render();window.scrollTo(0,0);
  speak(sess.cur.say);
}
function finish(){stopClock();stopMic(true);cancelSpeak();view='summary';render();window.scrollTo(0,0);}
function saveProgress(){store.set('eps_passed',passed);store.set('eps_wrong',wrong);}

/* ---------- speech in ---------- */
function stopMic(abort){
  if(mic&&mic.iv)clearInterval(mic.iv);
  if(mic&&mic.rec){try{mic.rec.onend=null;mic.rec.onerror=null;mic.rec.onresult=null;if(abort)mic.rec.abort();else mic.rec.stop();}catch(e){}}
  mic=null;
}
function updateLive(){
  const el=document.getElementById('live');
  if(el&&mic)el.textContent=(mic.final+' '+mic.interim).trim();
}
function startMic(){
  cancelSpeak();
  if(!SRC){ui.msg='เบราว์เซอร์นี้ยังไม่รองรับการฟังเสียง ลองใช้ Chrome หรือ Safari เวอร์ชันล่าสุด หรือพิมพ์คำตอบแทน';render();return;}
  const r=new SRC();
  r.lang='ko-KR';r.interimResults=true;r.continuous=!!sess.cur.long;r.maxAlternatives=1;
  const m={on:true,rec:r,final:'',interim:'',err:''};
  mic=m;
  r.onresult=ev=>{
    let f='',i='';
    for(let k=0;k<ev.results.length;k++){const x=ev.results[k];if(x.isFinal)f+=x[0].transcript+' ';else i+=x[0].transcript;}
    m.final=f.trim();m.interim=i;updateLive();
  };
  r.onerror=ev=>{m.err=ev.error||'error';};
  r.onend=()=>{m.on=false;if(m.iv)clearInterval(m.iv);if(mic===m)afterMic(m);};
  try{r.start();ui.msg='';if(sess.cur.limit){m.left=sess.cur.limit;m.iv=setInterval(()=>{m.left--;const el=document.getElementById('lim');if(el)el.textContent=m.left;if(m.left<=0){clearInterval(m.iv);try{r.stop();}catch(e){}}},1000);}}catch(e){m.on=false;mic=null;ui.msg='เริ่มไมค์ไม่ได้ ลองแตะอีกครั้ง';}
  render();
}
function afterMic(m){
  const text=(m.final+' '+m.interim).trim();
  mic=null;
  if(m.err==='not-allowed'||m.err==='service-not-allowed'){
    ui.msg='ไมค์ถูกบล็อก — อนุญาตให้เบราว์เซอร์ใช้ไมค์ หรือเปิดไฟล์นอกหน้าพรีวิว ตอนนี้พิมพ์คำตอบแทนได้';render();return;
  }
  if(!text){
    ui.msg=(!m.err||m.err==='no-speech')?'ไม่ได้ยินเสียง ลองแตะไมค์แล้วพูดอีกครั้ง':'ไมค์ผิดพลาด ('+m.err+') ลองอีกครั้งหรือพิมพ์คำตอบ';
    render();return;
  }
  answer(text);
}
function answer(text){
  const it=sess.cur;let score=null,ack=null;
  if(it.deck==='tools'){
    ui.ackText=text;
    if(it.ackAnswers){ui.ackOk=text.replace(/\s/g,'').indexOf(it.ackWord)>=0||Math.max.apply(null,it.ackAnswers.map(a=>sim(a,text)))>=0.7;}
    else ui.ackOk=Math.max.apply(null,ACK.map(a=>sim(a,text)))>=0.6||/알겠/.test(text);
    ui.stage='pick';ui.msg='';render();return;
  }
  if(isQ(it)){
    if(it.answers.length){score=0;it.answers.forEach(a=>{score=Math.max(score,sim(a,text));});}
  }else{
    score=Math.max.apply(null,ACK.map(a=>sim(a,text)));
    ack=score>=0.6||/알겠/.test(text);
  }
  ui.phase='answered';ui.res={text:text,score:score,ack:ack};ui.msg='';
  render();
}

  if(view==='home')$app.innerHTML=renderHome();
  else if(view==='session')$app.innerHTML=renderSession();
  else if(view==='summary')$app.innerHTML=renderSummary();
  else if(view==='setup')$app.innerHTML=renderSetup();

}

function countPassed(p,total){
  let c=0;Object.keys(passed).forEach(k=>{if(k[0]===p)c++;});
  return{c:Math.min(c,total),total:total};
}
function deckRow(k,glyph,name,meta,pr){
  const bar=pr?'<div class="track"><i style="width:'+Math.round(pr.c/pr.total*100)+'%"></i></div>':'';
  return '<button class="deck" data-a="start" data-k="'+k+'"><div class="emblem" aria-hidden="true">'+glyph+'</div><div class="deck-main"><div class="deck-name">'+name+'</div><div class="deck-meta">'+meta+(pr?' · ผ่านแล้ว '+pr.c+'/'+pr.total:'')+'</div>'+bar+'</div></button>';
}

function renderSession(){
  if(sess.cur.deck==='tools')return renderTools();
  const it=sess.cur,total=sess.list.length;
  const hidden=(SET.hideKo||sess.exam)&&!ui.peek&&ui.phase==='ask';
  const task=it.sub==='picto'?'ดูป้ายแล้วพูดความหมายเป็นภาษาเกาหลี':it.sub==='safety'?'ดูภาพแล้วพูดชื่ออุปกรณ์เป็นภาษาเกาหลี':it.sub==='wtool'?(it.img?'ดูภาพแล้วพูดชื่อเครื่องมือเป็นภาษาเกาหลี':'ฟังคำอธิบาย แล้วพูดชื่อเครื่องมือเป็นภาษาเกาหลี'):isQ(it)?'ฟังคำถาม แล้วตอบเป็นภาษาเกาหลี':it.deck==='motion'?'ฟังคำสั่ง ทำท่าตาม แล้วพูดว่า 네, 알겠습니다':'ฟังคำสั่ง ทำท่าใช้เครื่องมือ แล้วพูดว่า 네, 알겠습니다';
  let h='<div class="top"><button class="icon-btn" data-a="home" aria-label="กลับหน้าแรก">'+I.back+'</button><div class="top-title">'+esc(sess.title)+'</div>'+(sess.kind==='exam'?'<div class="clock" id="clock">'+fmtT(Math.floor((Date.now()-sess.started)/1000))+' / 4:00</div>':'')+'<div class="top-count">'+(sess.i+1)+'/'+total+'</div></div>';
  h+='<div class="prog"><i style="width:'+Math.round(sess.i/total*100)+'%"></i></div>';
  h+='<p class="task">'+task+'</p>';
  h+=hidden?'<div class="q quiet">ฟังแล้วตอบ (ตัวอักษรถูกซ่อนไว้)</div>':'<div class="q">'+esc(it.ko)+'</div>';
  if(it.big)h+='<div class="bigcard" aria-label="ตัวเลขที่ผู้สอบถือให้ดู">'+esc(it.big)+'</div>';
  if(it.img&&IMG[it.img])h+='<div class="photo"><img src="'+IMG[it.img]+'" alt=""></div>';
  h+='<div class="tools-row"><button class="chip" data-a="replay">'+I.spk+' ฟังอีกครั้ง</button><button class="chip" data-a="slow" aria-pressed="'+SET.slow+'">พูดช้า</button>';
  if(hidden)h+='<button class="chip" data-a="peek">ดูตัวอักษร</button>';
  if(ui.phase==='ask'&&!sess.exam&&!ui.showTh)h+='<button class="chip" data-a="showth">ดูความหมาย</button>';
  h+='</div>';
  if(ui.showTh&&ui.phase==='ask')h+='<div class="thbox">'+esc(it.th)+'</div>';

  if(ui.phase==='ask'){
    const on=mic&&mic.on;
    const live=mic?(mic.final+' '+mic.interim).trim():'';
    h+='<div class="mic-wrap"><button class="mic'+(on?' on':'')+'" data-a="mic" aria-label="'+(on?'หยุดฟัง':'เริ่มพูด')+'">'+(on?I.stop:I.mic)+'</button><div class="mic-label">'+(on?'กำลังฟัง… แตะเพื่อหยุด':'แตะเพื่อพูดตอบ')+'</div></div>';
    h+='<div class="live" id="live" aria-live="polite">'+esc(live)+'</div>';
    if(it.limit)h+='<p class="act-hint">เวลาแนะนำตัว '+it.limit+' วินาที'+(on?' · เหลือ <b id="lim">'+mic.left+'</b> วินาที':'')+'</p>';
    if(ui.msg)h+='<div class="note">'+esc(ui.msg)+'</div>';
    if(isQ(it)){
      h+='<div class="alt-row"><input class="input" id="typed" placeholder="หรือพิมพ์คำตอบเป็นฮันกึล" autocomplete="off" autocapitalize="off"><button class="btn" data-a="typed">ส่ง</button></div>';
    }else{
      h+='<div class="alt-row"><button class="btn block" data-a="done">พูดและทำท่าแล้ว (ไม่ใช้ไมค์)</button></div>';

  }else{
    const r=ui.res;
    if(r){
      let pill='';
      if(isQ(it)){
        if(r.score==null)pill='<span class="pill mid">ยังตรวจอัตโนมัติไม่ได้ — กรอกข้อมูลของฉันก่อน</span>';
        else{
          const hi=it.long?0.75:0.85,mid=it.long?0.5:0.6,p=Math.round(r.score*100);
          pill=r.score>=hi?'<span class="pill good">ตรงกับตัวอย่าง '+p+'%</span>':r.score>=mid?'<span class="pill mid">ใกล้เคียง '+p+'%</span>':'<span class="pill low">ยังต่างจากตัวอย่าง '+p+'%</span>';
        }
      }else{
        pill=r.ack?'<span class="pill good">ได้ยินคำว่า 알겠습니다</span>':'<span class="pill low">ไม่ได้ยินคำว่า 알겠습니다</span>';
      }
      h+='<div class="result"><div class="small">คุณพูดว่า</div><div class="said">'+esc(r.text)+'</div>'+pill+'</div>';
    }
    h+='<div class="model"><div class="ko">'+esc(it.ansKo)+'</div><div class="th">'+esc(it.ansTh)+'</div><div class="th">คำถามหมายถึง: '+esc(it.th)+'</div><button class="chip" data-a="hear">'+I.spk+' ฟังตัวอย่าง</button>';
    if(it.missing)h+='<div class="note calm" style="margin-top:10px">ตัวอย่างนี้ใช้ข้อมูลของคุณ ใส่ข้อมูลในหน้า “ข้อมูลของฉัน” แล้วจะตรงกับคุณ</div>';
    h+='</div>';
    h+='<div class="rate"><button class="btn bad" data-a="rate" data-v="0">ต้องซ้อมอีก</button><button class="btn good" data-a="rate" data-v="1">ตอบได้แล้ว</button></div>';
  }
  return h;
}

  h+='<div class="seg-row">'+wd(sp.tp)+wd(['가져 와서','เอามา แล้ว'])+wd(sp.op)+wd(sp.vp)+wd(['행동하세요','ทำท่า'])+'</div>';
  h+='<div class="th">'+esc(it.th)+'</div>';
  if(it.koFull)h+='<div class="ko" style="font-size:16px">'+esc(it.koFull)+'</div><div class="small">'+(it.official?'ประโยคนี้ตรงกับตัวอย่างในไฟล์กระทรวง':'ประโยคนี้ผมแต่งตามรูปแบบในไฟล์ (ไม่ใช่โจทย์ทางการ)')+'</div>';
  h+='<div class="pills">'+(ui.wrong?'<span class="pill low">เลือกเครื่องมือผิด '+ui.wrong+' ครั้ง</span>':'<span class="pill good">เลือกเครื่องมือถูกตั้งแต่ครั้งแรก</span>');
  if(ui.ackText)h+='<span class="pill '+(ui.ackOk?'good':'low')+'">'+(it.ackWord?(ui.ackOk?'พูดชื่อเครื่องมือถูกต้อง ('+esc(it.ackWord)+')':'ยังไม่ได้ยินชื่อเครื่องมือ (คำตอบ: '+esc(it.ackWord)+'입니다)'):(ui.ackOk?'ได้ยินคำว่า 알겠습니다':'ไม่ได้ยินคำว่า 알겠습니다'))+'</span>';
  if(ui.mistakes)h+='<span class="pill low">ตัดโดนต้นพืช '+ui.mistakes+' ครั้ง</span>';
  h+='</div><button class="chip" data-a="hearcmd">'+I.spk+' ฟังคำสั่งอีกครั้ง</button></div>';
  h+='<div class="rate"><button class="btn bad" data-a="rate" data-v="0">ต้องซ้อมอีก</button><button class="btn good" data-a="rate" data-v="1">ผ่านแล้ว ข้อต่อไป</button></div>';
  return h;
}

function renderTools(){
  const it=sess.cur,sp=it.spec,total=sess.list.length,st=ui.stage;
  const hidden=(SET.hideKo||sess.exam)&&!ui.peek&&st!=='done';
  const idx={ack:0,pick:1,act:2,done:3}[st];
  const cls=i=>i<idx?'ok':i===idx?'on':'';
  let h='<div class="top"><button class="icon-btn" data-a="home" aria-label="กลับหน้าแรก">'+I.back+'</button><div class="top-title">'+esc(sess.title)+'</div>'+(sess.kind==='exam'?'<div class="clock" id="clock">'+fmtT(Math.floor((Date.now()-sess.started)/1000))+' / 4:00</div>':'')+'<div class="top-count">'+(sess.i+1)+'/'+total+'</div></div>';
  h+='<div class="prog"><i style="width:'+Math.round(sess.i/total*100)+'%"></i></div>';
  h+='<div class="steps"><span class="'+cls(0)+'">'+(it.ackWord?'1 พูดชื่อเครื่องมือ':'1 พูดรับคำสั่ง')+'</span><span class="'+cls(1)+'">2 หยิบของบนโต๊ะ</span><span class="'+cls(2)+'">3 ลงมือทำ</span></div>';
  h+=hidden?'<div class="q quiet">ฟังแล้วทำตาม (ตัวอักษรถูกซ่อนไว้)</div>':'<div class="q">'+esc(it.ko)+'</div>';
  h+='<div class="tools-row"><button class="chip" data-a="replay">'+I.spk+' ฟังอีกครั้ง</button><button class="chip" data-a="slow" aria-pressed="'+SET.slow+'">พูดช้า</button>';
  if(hidden)h+='<button class="chip" data-a="peek">ดูตัวอักษร</button>';
  if(st!=='done'&&!sess.exam&&!ui.showTh)h+='<button class="chip" data-a="showth">ดูความหมาย</button>';
  h+='</div>';
  if(ui.showTh&&st!=='done')h+='<div class="thbox">'+esc(it.th)+'</div>';

  if(st==='ack'){
    h+='<p class="task" style="text-align:center">'+(it.ackPrompt||'พูดว่า <b>네, 알겠습니다</b> ก่อน แล้วค่อยไปหยิบของที่โต๊ะ')+'</p>'+micBlock();
    h+='<button class="linkbtn" data-a="skipack">ข้ามการพูด ไปที่โต๊ะเลย</button>';
  }else if(st==='pick'){
    const labels=!(SET.hideKo||sess.exam)||ui.peek;
    h+='<svg id="bench" class="scene" viewBox="0 0 360 400" role="img" aria-label="โต๊ะช่าง มีวัสดุด้านบนและเครื่องมือบนชั้นด้านล่าง">'+benchSvg(sess.bench,labels)+'</svg>';
    h+='<p class="act-hint">ลากเครื่องมือจากชั้นด้านล่างไปวางบนวัสดุที่คำสั่งบอก</p><p class="act-hint" id="actmsg"></p>';
  }else{
    const sc=SC[sp.act];
    h+='<div class="note calm" style="display:flex;align-items:center;gap:10px">'+toolIcon(sp.tool,32)+'<span>ในมือ: <b>'+esc(shortName(sp.toolKo))+'</b> · ใช้กับ <b>'+esc(shortName(sp.op[0]))+'</b></span></div>';
    h+='<svg id="scene" class="scene" viewBox="0 0 320 200" role="img" aria-label="พื้นที่ลงมือทำ">'+sc.svg(it)+'</svg>';
    if(sc.extra)h+=sc.extra;
    h+='<p class="act-hint" id="acthint">'+(st==='done'?'เยี่ยม! ทำเสร็จแล้ว':esc(sc.hint(it)))+'</p><p class="act-hint" id="actmsg"></p>';
    h+='<div id="donepanel"'+(st==='done'?'':' hidden')+'>'+donePanel(it)+'</div>';
  }
  return h;
}

function sceneDone(){
  ui.stage='done';
  const p=document.getElementById('donepanel');
  if(p){p.hidden=false;setTimeout(()=>{try{p.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}},150);}
  document.querySelectorAll('.steps span').forEach(x=>{x.className='ok';});
  const hint=document.getElementById('acthint');if(hint)hint.textContent='เยี่ยม! ทำเสร็จแล้ว';
}
function benchDone(){ui.stage='act';ui.msg='';render();}
function afterRender(){
  if(view==='game'&&gs&&gs.stage==='play'){const gsvg=document.getElementById('game');if(gsvg){if(gs.kind==='peg')mountPeg(gsvg);else mountPuzzle(gsvg);}return;}
  if(!(view==='session'&&sess&&sess.cur&&sess.cur.deck==='tools'))return;
  if(ui.stage==='pick'){const b=document.getElementById('bench');if(b)mountBench(b,sess.cur,benchDone);}
  else if(ui.stage==='act'){const svg=document.getElementById('scene');if(svg)SC[sess.cur.spec.act].mount(svg,sess.cur,sceneDone);}
}

function renderSummary(){
  const secs=Math.round((Date.now()-sess.started)/1000),mm=Math.floor(secs/60),ss=String(secs%60).padStart(2,'0');
  const good=sess.log.filter(x=>x.good).length,bad=sess.log.length-good;
  let h='<h2>เสร็จแล้ว</h2><p class="home-sub">'+esc(sess.title)+'</p>';
  h+='<div class="stat"><div><b>'+good+'</b>ตอบได้</div><div><b>'+bad+'</b>ต้องซ้อมอีก</div><div><b>'+mm+':'+ss+'</b>เวลารวม</div></div>';
  if(sess.kind==='exam')h+='<p class="small">สอบจริงมีเวลา 4 นาที ครั้งนี้ใช้ '+mm+':'+ss+'</p>';
  h+='<div>';
  sess.log.slice().sort((a,b)=>a.good-b.good).forEach(x=>{
    h+='<div class="logrow"><span class="dot '+(x.good?'good':'bad')+'" aria-label="'+(x.good?'ตอบได้':'ต้องซ้อมอีก')+'">'+(x.good?'✓':'!')+'</span><div>'+esc(x.ko)+'</div></div>';
  });
  h+='</div><div style="display:grid;gap:10px;margin-top:18px">';
  if(Object.keys(wrong).length)h+='<button class="btn primary" data-a="start" data-k="review">ซ้อมเฉพาะข้อที่ต้องซ้อมอีก</button>';
  h+='<button class="btn" data-a="home">กลับหน้าแรก</button></div>';
  return h;
}

function renderSetup(){
  const F=(k,label,hint,mode)=>'<label class="field"><span>'+label+'</span><input class="input" data-f="'+k+'" value="'+esc(P[k])+'" autocomplete="off"'+(mode==='n'?' inputmode="numeric"':'')+'>'+(hint?'<small>'+hint+'</small>':'')+'</label>';
  const S=(k,label,opts)=>'<label class="field"><span>'+label+'</span><select class="input" data-f="'+k+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(P[k]===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>';
  let h='<div class="top"><button class="icon-btn" data-a="home" aria-label="กลับหน้าแรก">'+I.back+'</button><div class="top-title">ข้อมูลของฉัน</div></div>';
  h+='<p class="small">ใช้เติมคำตอบตัวอย่างข้อแนะนำตัวและข้อ 1-9, 19-20 ข้อมูลจะอยู่ในเครื่องของคุณเท่านั้น</p>';
  h+=F('name','ชื่อ (ฮันกึล)','เช่น 알렉스 — ถ้ายังพิมพ์ฮันกึลไม่ได้ ให้ถามผมในแชทแล้วผมจะเขียนให้');
  h+=F('age','อายุ (ปี)','','n');
  h+=F('country','สัญชาติ (ฮันกึล)','เช่น 태국 (ไทย) 라오스 (ลาว)');
  h+=F('months','เรียนภาษาเกาหลีมากี่เดือน','','n');
  h+=F('birthY','ปีเกิด (ค.ศ.)','เช่น 1998','n');
  h+=F('birthM','เดือนเกิด (1-12)','','n');
  h+=F('birthD','วันที่เกิด (1-31)','','n');
  h+=S('married','แต่งงานแล้วหรือยัง',[['no','ยังไม่ได้แต่งงาน'],['yes','แต่งงานแล้ว']]);
  h+=S('kids','มีลูกไหม',[['no','ไม่มี'],['yes','มี']]);
  h+=F('family','สมาชิกในครอบครัว (คน)','','n');
  h+=F('siblings','จำนวนพี่น้อง (คน)','','n');
  h+=F('height','ส่วนสูง (ซม.)','','n');
  h+=F('weight','น้ำหนัก (กก.)','','n');
  h+=F('exp','ประสบการณ์ทำงาน (ฮันกึล ไม่บังคับ)','เช่น 저는 농사 경험이 있습니다 (ใส่ถ้ามีจริงเท่านั้น) จะถูกเพิ่มในบทแนะนำตัว 40 วินาที');
  h+=F('hometown','มาจากที่ไหน (ฮันกึล)','เช่น ชื่อจังหวัดหรืออำเภอเป็นอักษรเกาหลี');
  h+=F('home','อาศัยอยู่ที่ไหน (ฮันกึล)','');
  h+='<button class="btn primary block" data-a="home" style="margin-top:12px">บันทึกและกลับ</button>';
  return h;
}

function renderVocab(){
  let h='<div class="top"><button class="icon-btn" data-a="home" aria-label="กลับหน้าแรก">'+I.back+'</button><div class="top-title">คำศัพท์และภาพ</div></div><p class="small">แตะแถวไหนก็ได้เพื่อฟังเสียงอ่าน</p>';
  const row=(k,ko,th)=>'<button class="vrow" data-a="say" data-t="'+esc(ko.replace(/\(.*\)/,'').split(' / ')[0])+'"><span class="l">'+(k&&IMG[k]?'<img class="thumb" src="'+IMG[k]+'" alt="">':'')+'<span class="k">'+esc(ko)+'</span></span><span class="t">'+esc(th)+'</span></button>';
  h+='<h3>เครื่องมือ (ไฟล์กระทรวง) · เกษตรมาก่อน</h3>';
  WT.forEach(t=>{h+=row(t.k,t.ko,t.th);});
  h+='<h3>ป้ายสัญลักษณ์ความปลอดภัย</h3>';
  PT.forEach(p=>{h+=row(p.k,p.ko,p.th);});
  h+='<h3>อุปกรณ์ความปลอดภัย</h3>';
  SF.forEach(x=>{h+=row(x.k,x.ko,x.th);});
  TASKVOCAB.forEach(g=>{h+='<h3>'+g[0]+'</h3>';g[1].forEach(r=>{h+=row(null,r[0],r[1]);});});
  h+='<h3>สี (ฝึกปักไม้สี)</h3>';
  PEG_COLORS.forEach(c=>{h+=row(null,c.ko,c.th);});
  VOCAB.forEach(g=>{
    h+='<h3>'+g[0]+' (ชีทเดิม)</h3>';
    g[1].forEach(r=>{h+=row(null,r[0],r[1]);});
  });
  return h;
}

/* ---------- events ---------- */
const A={
  start:t=>startSession(t.dataset.k),
  home:()=>{stopB();stopG();stopClock();stopMic(true);cancelSpeak();view='home';render();window.scrollTo(0,0);},
  setup:()=>{view='setup';render();window.scrollTo(0,0);},
  vocab:()=>{view='vocab';render();window.scrollTo(0,0);},
  say:t=>speak(t.dataset.t),
  order:t=>{SET.shuffle=t.dataset.v==='1';store.set('eps_settings',SET);render();},
  opt:t=>{const k=t.dataset.k;SET[k]=!SET[k];store.set('eps_settings',SET);render();},
  slow:()=>{SET.slow=!SET.slow;store.set('eps_settings',SET);render();},
  replay:()=>{if(mic&&mic.on)return;speak(sess.cur.say);},
  hear:()=>speak(sess.cur.ansKo),
  peek:()=>{ui.peek=true;render();},
  showth:()=>{ui.showTh=true;render();},
  mic:()=>{if(mic&&mic.on){try{mic.rec.stop();}catch(e){}return;}startMic();},
  typed:()=>{const el=document.getElementById('typed');const t=el?el.value.trim():'';if(!t){ui.msg='พิมพ์คำตอบก่อนแล้วกดส่ง';render();return;}stopMic(true);cancelSpeak();answer(t);},
  done:()=>{stopMic(true);cancelSpeak();answer('(ทำท่าตามคำสั่งแล้ว)');ui.res={text:'(ทำท่าตามคำสั่งแล้ว ไม่ได้ใช้ไมค์)',score:null,ack:null};render();},
  skip:()=>{stopMic(true);cancelSpeak();ui.phase='answered';ui.res=null;ui.msg='';render();},
  info:()=>{view='info';render();window.scrollTo(0,0);},
  burpee:()=>{bs={stage:'menu',dur:+store.get('eps_burp_dur',60),count:0};view='burpee';render();window.scrollTo(0,0);},
  bopt:t=>{bs.dur=+t.dataset.v;store.set('eps_burp_dur',bs.dur);render();},
  bstart:()=>bStart(),
  bagain:()=>bStart(),
  btap:()=>{if(bs&&bs.stage==='run'){bs.count++;const el=document.getElementById('bcount');if(el)el.textContent=bs.count;}},
  game:t=>{gs={kind:t.dataset.k,stage:'menu',done:false,opt:Object.assign({mode:'copy',n:t.dataset.k==='peg'?4:3,cols:5,lim:0},store.get('eps_gopt_'+t.dataset.k,{}))};view='game';render();window.scrollTo(0,0);},
  gopt:t=>{const o=t.dataset.o;gs.opt[o]=(o==='n'||o==='cols'||o==='lim')?+t.dataset.v:t.dataset.v;store.set('eps_gopt_'+gs.kind,gs.opt);render();},
  gpreset:()=>{gs.opt.mode='copy';gs.opt.n=4;gs.opt.cols=2;gs.opt.lim=40;store.set('eps_gopt_'+gs.kind,gs.opt);render();},
  gstart:()=>gameStart(),
  gagain:()=>gameStart(),
  ghint:()=>{gs.hint=!gs.hint;render();},
  gsay:()=>{gs.said=true;sayPeg();},
  skipack:()=>{stopMic(true);cancelSpeak();ui.stage='pick';ui.msg='';render();},
  hearcmd:()=>speak(sess.cur.say),
  rate:t=>{
    const good=t.dataset.v==='1',it=sess.cur;
    sess.log.push({id:it.id,ko:it.ko,good:good});
    if(good){passed[it.id]=1;delete wrong[it.id];}else{wrong[it.id]=1;delete passed[it.id];}
    saveProgress();cancelSpeak();
    if(sess.i+1>=sess.list.length)finish();else{sess.i++;present();}
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t)return;
  const f=A[t.dataset.a];
  if(f)f(t);
});
document.addEventListener('input',e=>{
  const f=e.target&&e.target.dataset&&e.target.dataset.f;
  if(f){P[f]=e.target.value;store.set('eps_profile',P);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='typed'){A.typed();}
});

render();

if(window.__EPS_TEST)window.__EPS_TEST={sino:sino,native:native,josa:josa,sim:sim,build:build,monthKo:monthKo,interview:interview,P:P,SC:SC,TSPEC:TSPEC,TICON:TICON,WT:WT,FT:FT,PT:PT,SF:SF,ASPEC:ASPEC,IMG:IMG,nameAnswers:nameAnswers,makeBench:makeBench,getGs:function(){return gs;},getBs:function(){return bs;},bTick:bTick,TASKVOCAB:TASKVOCAB,pegGeo:pegGeo,pzGeo:pzGeo,PEG_COLORS:PEG_COLORS,mountBench:mountBench,benchSvg:benchSvg,toolPos:toolPos,matPos:matPos,BENCH_MAT:BENCH_MAT,setSess:function(x){sess=x;},setUi:function(x){ui=x;}};
})();
</script>
